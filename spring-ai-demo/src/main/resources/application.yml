spring:
  application:
    name: spring-ai-demo
  ai:
    bedrock:
      aws:
        # =====================================================================
        # >>> UPDATE YOUR AWS CREDENTIALS HERE <<<
        # AWS Bedrock uses AWS credentials (not a single "api key").
        # Fill these in, OR export them as environment variables instead:
        #   export AWS_ACCESS_KEY_ID=...
        #   export AWS_SECRET_ACCESS_KEY=...
        #   export AWS_REGION=us-east-1
        # sk-UBcNpTn36UIXNfXRagdsLg
        # =====================================================================
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY_HERE}
        secret-key: ${AWS_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_KEY_HERE}
        # session-token: ${AWS_SESSION_TOKEN:}   # uncomment if using temporary creds
      converse:
        chat:
          options:
            # Default model = Claude Haiku (fast & cheap, good for learning)
            model: global.anthropic.claude-haiku-4-5-20251001-v1:0
            temperature: 0.7
            max-tokens: 1024
          # Spring AI retries throttling/errors automatically
          max-retries: 5

# Friendly aliases for the Claude models available in this demo.
# Verify the exact model IDs in AWS Console -> Bedrock -> Model access.
app:
  ai:
    models:
      haiku: global.anthropic.claude-haiku-4-5-20251001-v1:0
      sonnet: global.anthropic.claude-sonnet-4-6
      opus: global.anthropic.claude-opus-4-5-20251101-v1:0

server:
  port: 8080
